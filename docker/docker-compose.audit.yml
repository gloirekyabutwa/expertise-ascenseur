services:
  db-audit:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro

  minio-audit:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"

  backend-audit:
    build: 
      context: ..
      dockerfile: app/Dockerfile
    command: bash -lc "/opt/pysetup/.venv/bin/alembic upgrade head && /opt/pysetup/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - POSTGRES_SERVER=db-audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
      - POSTGRES_APP_USER=app_user
      - POSTGRES_APP_PASSWORD=app_password
      - MINIO_ENDPOINT=minio-audit:9000
      - MINIO_EXTERNAL_ENDPOINT=localhost:9002
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=ascenseurs-pdf
      - MINIO_SECURE=False
      - SECRET_KEY=secret
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - SQLALCHEMY_DATABASE_URI=postgresql://app_user:app_password@db-audit:5432/app
      - SQLALCHEMY_ADMIN_DATABASE_URI=postgresql://postgres:password@db-audit:5432/app
    ports:
      - "8001:8000"
    depends_on:
      - db-audit
      - minio-audit
    volumes:
      - ..:/app

  frontend-audit:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8001
      - NODE_ENV=development
    ports:
      - "3001:3000"
    depends_on:
      - backend-audit
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
