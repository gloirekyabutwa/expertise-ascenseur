2       CUVETTE
2.  Installer en cuvette une commande du nouveau dispositif de demande de secours.

5       PORTES PALIERES
5.  Remplacer les regards vitrés des portes palières par des modèles présentant une résistance mécanique suffisante.

6       ORGANES DE SUSPENSION
6.  Installer des protections de points rentrants autour des poulies de l’installation.

7       CABINE
7.  Installer un éclairage de secours en cabine en accompagnement du nouveau dispositif de demande de secours triphonique.

8       ORGANES DE COMMANDES EN CABINE
8.  Installer un dispositif de demande de secours géolocalisable bidirectionnel et permettant de traiter le risque d’enfermement en gaine.

9       TOIT DE CABINE
9.  Installer un point de commande du nouveau dispositif de demande de secours sur le toit de cabine.

11       DISPOSITIFS DE SECURITE
11. Installer un dispositif empêchant la dérive excessive de la cabine en descente.
11. Installer un dispositif empêchant la dérive de la cabine.

12       LOCAUX DE MACHINE ET DE POULIES
12. Installer un dispositif de consignation électrique sur le disjoncteur principal de l’installation.
12. Augmenter l’éclairage du local Machinerie afin d’obtenir un taux d’éclairement de 200 lux à 1 m du sol autour des organes de travail et leur cheminement.
12. Augmenter l’éclairage du local Poulies afin d’obtenir un taux d’éclairement de 100 lux à 1 m du sol autour des organes de travail et leur cheminement.

13       MACHINE
13. Installer des protections de points rentrants autour des poulies de la machine.
13. Installer un système de contrôle et maintien à niveau de la cabine lui permettant d’obtenir et conserver une précision d’arrêt = à 20 mm.

14       ELECTRICITE
14. Installer des disjoncteurs différentiels en amont des circuits électriques d’éclairage et prises de courant de l’installation.
14. Installer un signalétique sur les bornes électriques en armoire restant sous tension après coupure du disjoncteur principal de l’installation.
14. Installer une protection de catégorie et type IP2X devant les bornes électriques nues et sous tension dans l’armoire de commande.
14. Remplacer le tableau d’arrivée de courant par un modèle adapté à la protection des intervenants et du matériel.