1       PAROIS DE PROTECTION 
1.   Augmenter à 3,5 m au minimum la hauteur des parois de service aux niveaux …..
1.   Augmenter à 2,5 m au minimum la hauteur de paroi de gaine aux niveaux …….
1.   Augmenter à 3 m au minimum la hauteur de paroi de gaine aux niveaux ……
1.   Installer un maillage de gaine dont la dimension de maille n’excède 10x60 mm.
1.   Installer une protection mécanique pour rendre inaccessible depuis le palier les leviers de déverrouillage de serrure à l’aide d’une tige rigide d’une longueur de 30 cm.
1.   Installer un contact électrique à arrachement pour le contrôle d’ouverture du portillon de visite en gaine.
1.   Remplacer la serrure du portillon de visite en gaine par un modèle permettant leur verrouillage sans clé depuis l’extérieur et leur ouverture sans clé depuis l’intérieur de la gaine.
1.   Installer un éclairage en gaine en complément du nouveau boîtier de commande d’inspection.

2       CUVETTE
2.   Installer un dispositif d’arrêt en cuvette en complément du nouveau boîtier de commande d’inspection.
2.   Installer un dispositif d’arrêt en cuvette.
2.   Installer un éclairage en cuvette en complément du nouveau boîtier de commande d’inspection.

5        PORTES PALIERES
5.   Remplacer les serrures actuelles par des modèles ayant satisfait aux essais types définis par l’article V du décret du 20 Août 2000.
5.   Installer des parois de protection pour empêcher d’atteindre les éléments de déverrouillage des serrures palières à l’aide d’une tige rigide de 30 cm.
5.   Installer des dispositifs de déverrouillage de secours de serrures accessibles depuis les paliers.
5.   Installer un dispositif limitant les actes susceptibles de porter atteinte aux verrouillages de portes palières.

7        CABINE
7.   Installer un dispositif de détection de présence de personne agissant sur toute la hauteur du passage libre.
7.   Installer un dispositif de verrouillage mécanique afin de rendre impossible l’ouverture de l’opérateur de porte lorsque la cabine est arrêtée entre deux niveaux.
7.   Installer une tôle garde-pied sous cabine dont la partie verticale est supérieure ou égale à 75 cm.

9        TOIT DE CABINE
9.   Installer un dispositif d’arrêt réglementaire sur le toit de cabine.
9.   Installer un boîtier de manœuvre d’inspection conforme aux exigences réglementaires après le 21 Mars 1980 ou décret du 24 Août 2000.

11      DISPOSITIFS DE SECURITE
11. Installer un dispositif parachute commandé par un limiteur de vitesse.
11. Remplacer le limiteur de vitesse.
11. Remplacer le dispositif parachute par un modèle à effet amorti approprié à la vitesse nominale de l’ascenseur.
11. Installer un limiteur de course inspection haute.

12      LOCAUX DE MACHINE ET DE POULIES
12. Installer une échelle d’accès au local Machinerie / Poulies équipée de son support verrouillable.
12. Installer une barre d’ancrage d’échelle d’accès au local Machinerie / Poulies.
12. Installer une barre de préhension au débouché de l’accès au local Machinerie / Poulies.
12. Installer un support verrouillable d’échelle d’accès au local Machinerie / Poulies.
12. Installer une échelle à crinoline nécessaire à l’accès du local Machinerie / Poulies (hauteur > 3m).
12. Installer un dispositif de contrebalancement sur la trappe d’accès au local Machinerie / Poulies.
12. Installer un dispositif empêchant le dégondage de la trappe d’accès au local Machinerie / Poulies.
12. Remplacer le panneau de la trappe du local Machinerie / Poulies par un modèle de résistance mécanique appropriée.
12. Installer des volets d'arrêt sur les panneaux de la trappe d'accès du  local Machinerie / Poulies
12. Installer sur la porte / trappe d’accès à la Machinerie / local Poulies une pancarte de signalisation.
12. Installer un garde-corps autour de la trémie d’accès au local Machinerie / Poulies.
12. Installer un interrupteur d’arrêt dans le local des Poulies.